# Legacy Squarespace URL redirects
#
# These paths were live on the old Squarespace site and still rank in Google
# (accumulated impressions/clicks/authority), but return 404 on the current
# static site. 301 them to the equivalent live page to preserve that ranking
# authority instead of losing it to a dead link.
#
# Exact-match (`location =`) is used deliberately so these rules only catch
# the literal legacy path, not lookalikes like /about-us or /aboutsomething.
location = /about {
    return 301 /chi-siamo.html;
}

location = /menu {
    return 301 /menu.html;
}

location = /gallery {
    return 301 /galleria.html;
}

location = /contact {
    return 301 /contatti.html;
}
