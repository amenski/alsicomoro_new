<section class="hero" style="min-height:60vh; max-height:640px; height:60vh; background:var(--ink)" aria-label="Pagina non trovata">

</section>

<div id="site-footer" data-page="404"></div>

<script>
/* ============================================================
   REVEAL ON SCROLL
   ============================================================ */
(function(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('on');
        io.unobserve(e.target);
      }
    });
  }, {threshold:.12, rootMargin:'0px 0px -60px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
})();
</script>
